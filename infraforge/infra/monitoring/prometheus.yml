# InfraForge v1 — Prometheus scrape config

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    env: infraforge-v1

# Load alert rules
rule_files:
  - "alerts/*.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # ── Platform API ────────────────────────────────────────────────────────────
  - job_name: platform-api
    static_configs:
      - targets: ["platform-api:8000"]
    metrics_path: /metrics

  # ── Lab orchestrator ────────────────────────────────────────────────────────
  - job_name: lab-orchestrator
    static_configs:
      - targets: ["lab-orchestrator:9000"]
    metrics_path: /metrics

  # ── Lab grader ──────────────────────────────────────────────────────────────
  - job_name: lab-grader
    static_configs:
      - targets: ["lab-grader:9100"]
    metrics_path: /metrics

  # ── PostgreSQL (via postgres_exporter) ───────────────────────────────────────
  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  # ── Redis (via redis_exporter) ───────────────────────────────────────────────
  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]

  # ── Node metrics (host) ─────────────────────────────────────────────────────
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  # ── Celery workers (via flower) ──────────────────────────────────────────────
  - job_name: celery
    static_configs:
      - targets: ["flower:5555"]
    metrics_path: /metrics
